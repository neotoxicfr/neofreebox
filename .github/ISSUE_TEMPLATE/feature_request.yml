name: Proposer une fonction
description: Suggérer une capacité ou une option
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problème
      description: Que cherches-tu à faire qui est pénible ou impossible aujourd'hui ?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Solution proposée
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives envisagées
