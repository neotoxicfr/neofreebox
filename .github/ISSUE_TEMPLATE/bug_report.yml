name: Signaler un bug
description: Quelque chose ne marche pas comme prévu
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Retire les jetons, mots de passe et données personnelles (adresses IP,
        MAC, noms d'appareils) des journaux avant de les coller.

  - type: input
    id: version
    attributes:
      label: Version
      description: Tag de version, tag d'image ou commit
      placeholder: "v1.0.0 / dev"
    validations:
      required: true

  - type: textarea
    id: what-happens
    attributes:
      label: Ce qui se passe
      description: Ce que tu observes, et ce que tu attendais à la place.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Journaux
      description: Les sorties utiles, expurgées au préalable.
      render: text

  - type: input
    id: deployment
    attributes:
      label: Déploiement
      placeholder: "docker compose, amd64, NAS"
