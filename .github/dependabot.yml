version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "daily"
    # No waiting period: without this, a release waits 3 days by default.
    cooldown:
      exclude: ["*"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "daily"
    # No waiting period: without this, a release waits 3 days by default.
    cooldown:
      exclude: ["*"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "daily"
    # No waiting period: without this, a release waits 3 days by default.
    cooldown:
      exclude: ["*"]
    open-pull-requests-limit: 5
    # One pull request for the routine bumps; a major version gets its own.
    groups:
      go-modules:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
